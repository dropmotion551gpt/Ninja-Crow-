name: Build Ninja Crow

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK licenses (runner ka SDK use hota hai)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Check game file
        run: |
          ls -la
          test -f www/index.html || { echo "ERROR: www/index.html nahi mili"; exit 1; }

      - name: Write clean package.json and Capacitor config
        run: |
          cat > package.json <<'EOF'
          {
            "name": "ninja-crow",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/cli": "^6.1.2",
              "@capacitor/core": "^6.1.2"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ninjacrow.game",
            "appName": "Ninja Crow",
            "webDir": "www",
            "backgroundColor": "#0F172A"
          }
          EOF
          rm -f package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: |
          npx cap telemetry off || true
          rm -rf android
          npx cap add android
          ls android/app/src/main/res

      - name: Ninja Crow logo as app icon
        continue-on-error: true
        run: |
          ICON=assets/branding/ninja-crow-app-icon-1024.png
          LOGO=assets/branding/ninja-crow-logo-transparent.png
          [ -f "$ICON" ] || { echo "icon file nahi mili, default icon use hoga"; exit 0; }
          [ -f "$LOGO" ] || LOGO="$ICON"
          sudo apt-get install -y imagemagick > /dev/null 2>&1 || true
          RES=android/app/src/main/res
          mkdir -p /tmp/icons
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            inner=$((f*62/100))
            convert "$ICON" -resize ${s}x${s} /tmp/icons/$n.png
            convert -size ${f}x${f} xc:none \( "$LOGO" -resize ${inner}x${inner} \) -gravity center -composite /tmp/icons/$n-fg.png
          done
          for n in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $RES/mipmap-$n
            rm -f $RES/mipmap-$n/ic_launcher*.webp
            cp /tmp/icons/$n.png $RES/mipmap-$n/ic_launcher.png
            cp /tmp/icons/$n.png $RES/mipmap-$n/ic_launcher_round.png
            cp /tmp/icons/$n-fg.png $RES/mipmap-$n/ic_launcher_foreground.png
          done
          if [ -f $RES/values/ic_launcher_background.xml ]; then
            sed -i 's/#FFFFFF/#0F172A/I' $RES/values/ic_launcher_background.xml
          fi
          echo "icon ready"

      - name: Landscape and fullscreen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q screenOrientation "$M" || sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' "$M" || true
          S=android/app/src/main/res/values/styles.xml
          grep -q windowFullscreen "$S" || sed -i 's#\(<style name="AppTheme.NoActionBar"[^>]*>\)#\1<item name="android:windowFullscreen">true</item>#' "$S" || true
          head -30 "$M"

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK Ninja-Crow
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ninja-Crow.apk

      - name: Upload Ninja Crow APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Crow
          path: Ninja-Crow.apk
          if-no-files-found: error

      - name: Publish in Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ninja-crow-${{ github.run_number }}
          name: Ninja Crow
          files: Ninja-Crow.apk

      - name: Upload Gradle reports if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: android/app/build/reports
          if-no-files-found: ignore
          
