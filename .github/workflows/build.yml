
name: Build Ninja Crow Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install Pillow
        run: pip install Pillow

      - name: Apply Ninja Crow App Icons
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          sources = {
              "ic_launcher": Path("ic_launcher.png"),
              "ic_launcher_round": Path("ic_launcher_round.png")
          }

          base = Path("android/app/src/main/res")

          for name, source in sources.items():
              if not source.exists():
                  raise SystemExit(f"Missing icon: {source}")

              original = Image.open(source).convert("RGBA")

              for density, size in sizes.items():
                  folder = base / f"mipmap-{density}"
                  folder.mkdir(parents=True, exist_ok=True)
                  icon = original.resize((size, size), Image.Resampling.LANCZOS)
                  icon.save(folder / f"{name}.png")

          # Use density-specific PNG icons instead of default adaptive icons.
          adaptive = base / "mipmap-anydpi-v26"
          if adaptive.exists():
              for name in sources:
                  xml = adaptive / f"{name}.xml"
                  if xml.exists():
                      xml.unlink()
          PY

      - name: Set landscape orientation
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"

          for activity in root.iter("activity"):
              if activity.get(ns + "name", "").endswith("MainActivity"):
                  activity.set(ns + "screenOrientation", "landscape")

          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Android signing secrets are missing."
            exit 1
          }
          echo "$KEYSTORE_BASE64" | base64 --decode > ninja-crow-release.jks

      - name: Sign Release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" ninja-crow-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks ninja-crow-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out Ninja-Crow.apk \
            ninja-crow-aligned.apk

          "$BUILD_TOOLS/apksigner" verify Ninja-Crow.apk

      - name: Upload Ninja Crow APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Crow-Release
          path: Ninja-Crow.apk
          if-no-files-found: error
          retention-days: 30
          
