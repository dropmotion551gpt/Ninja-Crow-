
name: Build Ninja Crow Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Ninja Crow Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Game
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Verify Game Files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f ic_launcher.png
          test -f ic_launcher_round.png

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android Project
        run: npx cap sync android

      - name: Install Pillow
        run: pip install Pillow

      - name: Create Ninja Crow Icons
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          res = Path("android/app/src/main/res")

          for name in ["ic_launcher", "ic_launcher_round"]:
              source = Path(name + ".png")
              if not source.exists():
                  raise SystemExit("Missing " + str(source))

              original = Image.open(source).convert("RGBA")

              for density, size in sizes.items():
                  folder = res / ("mipmap-" + density)
                  folder.mkdir(parents=True, exist_ok=True)
                  icon = original.resize(
                      (size, size), Image.Resampling.LANCZOS
                  )
                  icon.save(folder / (name + ".png"))

          adaptive = res / "mipmap-anydpi-v26"
          if adaptive.exists():
              for name in ["ic_launcher", "ic_launcher_round"]:
                  xml = adaptive / (name + ".xml")
                  if xml.exists():
                      xml.unlink()
          PY

      - name: Set Game Landscape
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"

          for activity in root.iter("activity"):
              name = activity.get(android + "name", "")
              if name.endswith("MainActivity"):
                  activity.set(android + "screenOrientation", "landscape")

          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Check Signing Secrets
        env:
          STORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$PASS" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASS" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Sign Ninja Crow APK
        env:
          STORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          echo "$STORE" | base64 --decode > ninja-crow.jks

          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" -p -f 4 \
            "$APK" ninja-crow-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks ninja-crow.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out Ninja-Crow.apk \
            ninja-crow-aligned.apk

          "$BUILD_TOOLS/apksigner" verify Ninja-Crow.apk

          rm -f ninja-crow.jks ninja-crow-aligned.apk

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Crow-Release-APK
          path: Ninja-Crow.apk
          if-no-files-found: error
          retention-days: 30
          
