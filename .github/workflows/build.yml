name: Build Ninja Crow APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check game file
        run: |
          ls -la
          test -f www/index.html || { echo "ERROR: www/index.html nahi mili"; exit 1; }

      - name: Write clean package.json and Capacitor config
        run: |
          cat > package.json <<'EOF'
          {
            "name": "ninja-crow",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/cli": "^6.1.2",
              "@capacitor/core": "^6.1.2"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ninjacrow.game",
            "appName": "Ninja Crow",
            "webDir": "www",
            "backgroundColor": "#0F172A"
          }
          EOF
          rm -f package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: |
          npx cap telemetry off || true
          rm -rf android
          npx cap add android
          ls android/app/src/main/res

      - name: App icon from branding (optional)
        continue-on-error: true
        run: |
          ICON=assets/branding/ninja-crow-app-icon-1024.png
          if [ -f "$ICON" ]; then
            sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
            RES=android/app/src/main/res
            mkdir -p /tmp/icons
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              n=${d%%:*}; s=${d##*:}
              convert "$ICON" -resize ${s}x${s} /tmp/icons/$n.png
            done
            rm -rf $RES/mipmap-anydpi-v26
            for n in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p $RES/mipmap-$n
              rm -f $RES/mipmap-$n/ic_launcher*.png $RES/mipmap-$n/ic_launcher*.webp
              cp /tmp/icons/$n.png $RES/mipmap-$n/ic_launcher.png
              cp /tmp/icons/$n.png $RES/mipmap-$n/ic_launcher_round.png
            done
          else
            echo "icon file nahi mili, default icon use hoga"
          fi

      - name: Landscape and fullscreen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q screenOrientation "$M" || sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' "$M" || true
          S=android/app/src/main/res/values/styles.xml
          grep -q windowFullscreen "$S" || sed -i 's#\(<style name="AppTheme.NoActionBar"[^>]*>\)#\1<item name="android:windowFullscreen">true</item>#' "$S" || true
          head -30 "$M"

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Crow-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK in Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ninja Crow build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Gradle reports if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: android/app/build/reports
          if-no-files-found: ignore
          
